services:
  train-sft-adri:
    container_name: train-sft-adri
    build:
      context: .
      dockerfile: Dockerfile
    image: reasoning-tool-llm-agent
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/app
      - ./hf_cache:/root/.cache/huggingface
    environment:
      - SFT_MODEL_PATH=/app/rlm/weights/sft_lora
      - HF_HOME=/root/.cache/huggingface
    working_dir: /app
    command: ["python3", "src/rlm/train_sft.py"]

  train-grpo-adri:
    container_name: train-grpo-adri
    build:
      context: .
      dockerfile: Dockerfile
    image: reasoning-tool-llm-agent
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/app
      - ./hf_cache:/root/.cache/huggingface
    environment:
      - SFT_MODEL_PATH=/app/rlm/weights/sft_lora
      - FINAL_MODEL_PATH=/app/rlm/weights/final_rlm_lora
      - HF_HOME=/root/.cache/huggingface
    working_dir: /app
    command: ["python3", "src/rlm/train_grpo.py"]

  agent-inference-adri:
    container_name: agent-inference-adri
    build:
      context: .
      dockerfile: Dockerfile
    image: reasoning-tool-llm-agent
    ports:
      - "8009:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/app
      - ./hf_cache:/root/.cache/huggingface
    environment:
      - SFT_MODEL_PATH=/app/rlm/weights/sft_lora
      - FINAL_MODEL_PATH=/app/rlm/weights/final_rlm_lora
      - HF_HOME=/root/.cache/huggingface
    working_dir: /app
    command: ["python3", "src/api/app.py"]

  agent-bash-adri:
    container_name: agent-bash-adri
    build:
      context: .
      dockerfile: Dockerfile
    image: reasoning-tool-llm-agent
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/app
      - ./hf_cache:/root/.cache/huggingface
    environment:
      - SFT_MODEL_PATH=/app/rlm/weights/sft_lora
      - FINAL_MODEL_PATH=/app/rlm/weights/final_rlm_lora
      - HF_HOME=/root/.cache/huggingface
    working_dir: /app
    command: ["bash"]