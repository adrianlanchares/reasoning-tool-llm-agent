services:
  train-sft-nacho:
    container_name: train-sft-nacho
    build:
      context: .
      dockerfile: Dockerfile
    image: reasoning-tool-llm-agent
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/app
      - ./hf_cache:/root/.cache/huggingface
    environment:
      - SFT_MODEL_PATH=/app/rlm/weights/sft_lora
      - HF_HOME=/root/.cache/huggingface
    working_dir: /app
    command: ["python3", "rlm/train_sft.py"]

  train-grpo-nacho:
    container_name: train-grpo-nacho
    build:
      context: .
      dockerfile: Dockerfile
    image: reasoning-tool-llm-agent
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/app
      - ./hf_cache:/root/.cache/huggingface
    environment:
      - SFT_MODEL_PATH=/app/rlm/weights/sft_lora
      - FINAL_MODEL_PATH=/app/rlm/weights/final_rlm_lora
      - HF_HOME=/root/.cache/huggingface
    working_dir: /app
    command: ["python3", "rlm/train_grpo.py"]

  inference-rlm-nacho:
    container_name: inference-rlm-nacho
    build:
      context: .
      dockerfile: Dockerfile
    image: reasoning-tool-llm-agent
    ports:
      - "8011:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/app
      - ./hf_cache:/root/.cache/huggingface
    environment:
      - SFT_MODEL_PATH=/app/rlm/weights/sft_lora
      - FINAL_MODEL_PATH=/app/rlm/weights/final_rlm_lora
      - HF_HOME=/root/.cache/huggingface
    working_dir: /app
    command: ["python3", "api/app.py"]

  bash-rlm-nacho:
    container_name: bash-rlm-nacho
    build:
      context: .
      dockerfile: Dockerfile
    image: reasoning-tool-llm-agent
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/app
      - ./hf_cache:/root/.cache/huggingface
    environment:
      - SFT_MODEL_PATH=/app/rlm/weights/sft_lora
      - FINAL_MODEL_PATH=/app/rlm/weights/final_rlm_lora
      - HF_HOME=/root/.cache/huggingface
    working_dir: /app
    command: ["bash"]