server {
    listen 80;

    # Serve the React app
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* → agent API on the DGX host at port 8010
    # Uses host.docker.internal to reach the host from within the container.
    # If that doesn't resolve on your DGX, replace it with the host's IP
    # or use the extra_hosts override in docker-compose.frontend.yml.
    location /api/ {
        proxy_pass http://nas-agent:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Agent responses can take a while — don't time out too early
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }
}
