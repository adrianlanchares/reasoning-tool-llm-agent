services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-frontend:latest
    container_name: nas-agent-frontend
    ports:
      - "8022:80"
    restart: unless-stopped
    networks:
      - nas_reasoning_network

networks:
  nas_reasoning_network:
    name: nas_reasoning_network
    external: true
