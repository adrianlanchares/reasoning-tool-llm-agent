services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-frontend:latest
    container_name: agent-frontend
    ports:
      - "8021:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - nas_reasoning_network

networks:
  nas_reasoning_network:
    name: nas_reasoning_network
    external: true
